<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>Moggu Cafe</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="header">
            <div class="navbar">
                <img src="images/logo.png" width="250">
                <nav>
                <ul id="MenuItems">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="offer.html">Offers</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="myorder.html">MyOrder</a></li>
                    <li><a href="ordernow.html">OrderNow</a></li>
                    
                </ul>
                </nav>
            </div>
        </div>
        <div class="order-card">
        <h1 style="font-size: 30px;">How would you like to order?</h1>
        <p class="subtitle">Choose one to continue to checkout</p>
        <input type="radio" name="order-type" id="online" checked>
        <input type="radio" name="order-type" id="dinein" >
        <div class="toggle-group">
            <label for="online">
                <span class="icon">&#128690;</span>
                <p class="title-2">Online</p>
                <p class="desc">Delivery or pickup</p>
            </label>
            <label for="dinein">
                <span class="icon">&#127869;</span>
                <p class="title-2">Dine-in</p>
                <p class="desc">Scan table QR</p>
            </label>
        </div>
        <div class="field-section online-fields">
            <label class="field-label">Delivery address</label>
            <input type="text" placeholder="Enter your delivery address">
            <p class="hint">Or choose pickup at checkout</p>
        </div>
        <div class="field-section dinein-fields">
            <label class="field-label">Table number</label>
            <input type="text" placeholder="e.g Table 12">
            <p class="hint">Scan the QR code on your table to auto-fill this</p>
        </div>
        <div class="summary-row">
            <span class="label">Total (3 items)</span>
            <span class="amount">&#8377;696</span>
        </div>
        <button class="continue-btn">Continue to payment</button>
        </div>
    </body>
</html>
