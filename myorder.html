<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>Moggu Cafe</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="header">
            <div class="navbar">
                <img src="images/logo.png" width="250">
                <nav>
                <ul id="MenuItems">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="offer.html">Offers</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="myorder.html">MyOrder</a></li>
                    <li><a href="ordernow.html">OrderNow</a></li>
                    
                </ul>
                </nav>
            </div>
        </div>
    <div class="small-containers cart-page">
            <table>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
                <tr>
                    <td>
                        <div class="cart-info">
                            <img src="images/m3.jpg">
                            <div>
                                <p>Peri Peri Pizza</p>
                                <small>Price: Rs.269</small>
                                <br><br>
                                <a href="">Remove</a>
                            </div>
                        </div>
                    </td>
                    <td><input type="number" value="1"></td>
                    <td>Rs.269</td>
                </tr>
               
                <tr>
                    <td>
                        <div class="cart-info">
                            <img src="images/m7.jpg">
                            <div>
                                <p>Dragon Burger</p>
                                <small>Price: Rs.256</small>
                                <br><br>
                                <a href="">Remove</a>
                            </div>
                        </div>
                    </td>
                    <td><input type="number" value="1"></td>
                    <td>Rs.256</td>
                </tr>
        
                <tr>
                    <td>
                        <div class="cart-info">
                            <img src="images/m11.jpg">
                            <div>
                                <p>Nuts Shake</p>
                                <small>Price: Rs.156</small>
                                <br><br>
                                <a href="">Remove</a>
                            </div>
                        </div>
                    </td>
                    <td><input type="number" value="1"></td>
                    <td>Rs.156</td>
                </tr>
            </table>
            <div class="total-price">
                <table>
                <tr>
                    <td>Subtotal</td>
                    <td>Rs.682</td>
                </tr>
                <tr>
                    <td>Tax</td>
                    <td>Rs.15</td>
                </tr>
                <tr>
                    <td>Total</td>
                    <td>Rs.696</td>
                </tr>
                </table>
            </div>
            
            <button type="button" class="btn" style="margin-left: 700px;"><a href="ordernow.html" style="text-decoration: none; font-size: 30px;">Order Now</a></button>
              
        </div>
    </body>
</html>
